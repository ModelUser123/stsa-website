[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/"
  to = "/rsvp/index.html"
  status = 301

[[redirects]]
  from = "/rsvp"
  to = "/rsvp/index.html"
  status = 200

[[redirects]]
  from = "/rsvp/*"
  to = "/rsvp/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions]
  node_bundler = "esbuild"

# Security headers applied to all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# API routes — CORS is handled per-request in auth.js; static headers here are
# a belt-and-suspenders fallback (note: functions can override these)
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Access-Control-Allow-Origin = "https://stsa-events.netlify.app"
    Access-Control-Allow-Headers = "Content-Type, X-Admin-Token"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
